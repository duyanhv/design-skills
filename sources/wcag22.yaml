# Source manifest: Web Content Accessibility Guidelines (WCAG) 2.2
id: wcag22
name: WCAG 2.2
kind: wcag
# The published TR is built from this tree; SC ids are identical, so citations resolve on w3.org.
base_url: https://raw.githubusercontent.com/w3c/wcag/main/guidelines
entry: /index.html
canonical_url: https://www.w3.org/TR/WCAG22/
cadence: monthly

license:
  spdx: W3C-Document-License   # no derivatives → treated like Apple: built locally, not committed
  redistributable: false
  attribution: "Text © W3C (World Wide Web Consortium). Web Content Accessibility Guidelines 2.2, https://www.w3.org/TR/WCAG22/. W3C Document License."

platforms: []
categories: [perceivable, operable, understandable, robust, reference, conformance, glossary]
skip_sections: []

skill:
  name: wcag22
  description: >-
    WCAG 2.2 success criteria as rules with conformance levels (A/AA/AAA), a glossary, and
    citations, for building or auditing accessible web and hybrid-app UI. Use when checking
    contrast, keyboard access, focus, forms, timing, motion, target size, or any
    accessibility/a11y compliance question.
  max_skill_lines: 300
  rationale_label: Details
  index: rules
  notes: |
    **Applicability is decided by the conformance target, not by this skill.** Every success criterion
    is normative text and is shown as MUST; which ones bind you depends on the level you are claiming
    ([WCAG conformance requirements](references/conformance/conformance-reqs.md#conformance-requirements)):

    - Target **Level A** → apply criteria marked `(Level A)`.
    - Target **Level AA** (the usual legal/procurement baseline) → apply `(Level A)` and `(Level AA)`.
    - Target **Level AAA** → apply all three. W3C advises that AAA conformance is not achievable for
      all content, so AAA criteria are commonly treated as enhancements unless AAA is the stated goal.

    Ask for the target if it is not stated; assume **AA** only when you say so in the finding.

    **Normative vs. informative.** WCAG says which of its own words create requirements
    ([Interpreting Normative Requirements](references/conformance/conformance-reqs.md#interpreting-normative-requirements)):
    the criteria are normative; "diagrams, examples, and notes are informative (non-normative)" and
    "provide advisory information to help interpret the guidelines but do not create requirements
    that impact a conformance claim". Both are shipped under the criterion they belong to:

    - An **unlabelled** block is part of the criterion — its conditions ("at least one of the
      following is true"), its exceptions ("except when…"), its definitions. Apply it: a criterion
      quoted without these is a different rule.
    - A block marked **`_[informative]_`** is a note or an example. Use it to interpret the
      criterion; never fail something on it alone. 2.5.3 Label in Name requires the name to
      *contain* the visible label, and its note says a best practice is to put the label at the
      *start*: a name that contains the label later satisfies 2.5.3, and reporting otherwise is a
      false finding.

    Cite the criterion, not the note, and say when a point is advisory.

    **Reviewing criteria is not establishing conformance.** Reviewing the criteria a task touches is
    the normal request; keep it scoped to that task rather than turning a button review into a site
    audit. But conformance is defined for whole pages, so a claim that something "conforms" or "is
    WCAG 2.2 AA" additionally requires
    [cc1–cc5](references/conformance/conformance-reqs.md#conformance-requirements): the level met in
    full, full pages, complete processes, only accessibility-supported technologies, and
    non-interference. If you have not checked those, report what you did check and say the review
    does not establish conformance.

    Criteria added in 2.2 are marked "(new in 2.2)". Terms in italics or otherwise undefined in a rule
    ("large-scale text", "essential", "target") are defined in
    [references/glossary/glossary.md](references/glossary/glossary.md).
    The defined set of input purposes that criterion 1.3.5 refers to is in
    [references/reference/input-purposes.md](references/reference/input-purposes.md).
  routing:
    - when: "contrast, color, text size, reflow, hover/tooltip content"
      read: [distinguishable, glossary]
    - when: "images, icons, CAPTCHA alternatives"
      read: [text-alternatives]
    - when: "video, audio, captions, transcripts"
      read: [time-based-media]
    - when: "semantics, headings, form labels, autocomplete, reading order"
      read: [adaptable, input-purposes]
    - when: "keyboard, shortcuts, focus traps"
      read: [keyboard-accessible]
    - when: "timeouts, session expiry, auto-updating or moving content"
      read: [enough-time]
    - when: "animation, flashing, motion"
      read: [seizures-and-physical-reactions]
    - when: "focus order, focus visibility, skip links, page titles, headings, help placement"
      read: [navigable]
    - when: "touch/pointer targets, gestures, drag and drop, motion actuation, label in name"
      read: [input-modalities]
    - when: "language, unusual words, abbreviations"
      read: [readable]
    - when: "unexpected context changes, consistent navigation, consistent help"
      read: [predictable]
    - when: "forms, validation errors, login, CAPTCHA, re-entering data, authentication"
      read: [input-assistance]
    - when: "ARIA name/role/value, custom widgets, status messages / live regions"
      read: [compatible]
    - when: "a conformance claim, an audit conclusion, or whether something 'is WCAG AA'"
      read: [conformance-reqs]
