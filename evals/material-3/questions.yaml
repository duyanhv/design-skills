- q: Does implementation research distinguish theming layers and library assumptions?
  source: sources
  expect: ["MaterialTheme", "component tokens", "MUI React"]
- q: Does review require actual evidence rather than a decorative source link?
  source: evidence
  expect: ["assigns no extracted rule IDs", "Merely attaching a link", "runtime test"]

# Task guides, added when the bundle grew from three files to eight.
#
# Same discipline as the Apple set: each question names a requirement the guide has to keep meeting,
# and the strings are the ones that cannot be reworded without the requirement changing. The check
# also asserts the SKILL.md routing table reaches the page at all, which is the failure a reader
# would actually hit.
#
# Not matched: whole sentences, and any number. This bundle deliberately states no token values or
# thresholds, so an eval asserting one would be asserting a defect.

- q: Does the theming guide treat color as roles with pairings, not a palette?
  source: theming
  expect:
    # The role/partner pairing is the idea a reviewer has to carry away.
    - "on-primary"
    - "surface-container"
    # A change has to be attributed to a layer, or a local fix silently becomes global.
    - "Reference"
    - "System"
    - "Component"
    # Dark is a separate scheme, not an inversion.
    - "not an inversion"

- q: Does the components guide treat emphasis as a priority claim and require the states?
  source: components
  expect:
    - "state layers"
    # Disabled must not be a licence to fail contrast.
    - "disabled"
    # The library is not the specification.
    - "is not Material"
    # A review that only saw the default state has established very little.
    - "which states you exercised"

- q: Does the layout guide treat a size change as a behaviour change, not a width change?
  source: layout
  expect:
    - "Focus order"
    # Selection has to survive the navigation switching shape.
    - "must be selected in the rail"
    # The visible control and its target are different rectangles.
    - "touch target"
    # A device name is not a test condition; a width is.
    - "rather than"

- q: Does the typography guide separate a type role from a semantic element?
  source: typography
  expect:
    # Styling text like a heading tells assistive technology nothing.
    - "not a heading"
    # The check that finds real defects.
    - "system font size"
    # Turning scaling off is a decision to exclude users, not a fix.
    - "not a fix"
    # Localisation is a typography problem, and a claim is bounded by the language tested.
    - "expands"

- q: Does the accessibility guide separate normative requirements from Material's advice?
  source: accessibility
  expect:
    # The standard owns the thresholds; Material points at them.
    - "WCAG 2.2 SC 1.4.3"
    - "normative"
    - "advice"
    # This bundle is not a conformance standard and must keep saying so.
    - "not a conformance standard"
    # A library default is evidence about the default, not about the screen.
    - "therefore it conforms"
    # The boundary between what source can settle and what needs a running interface.
    - "Needs a running interface"
