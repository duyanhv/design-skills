name: refresh-sources
on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Source id (e.g. apple-hig). Empty = all."
        required: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ inputs.source }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/${{ inputs.source || 'all' }}
          title: "refresh: ${{ inputs.source || 'all sources' }}"
          body: "Automated regeneration. Review the IR diff under `ir/` — the skill files under `skills/` are derived."
          commit-message: "chore: refresh ${{ inputs.source || 'all sources' }}"
