name: ci
on:
  pull_request:
  push:
    branches: [main]

# One entry point. CI runs `bun run check`, which is the same command a contributor runs locally,
# so the two cannot drift.
#
# This replaced a workflow that listed every check as its own step. An audit showed why that shape
# was unfixable: the parity test compared a regex over the YAML against a regex over the package
# script, and a step could be neutered three ways it could not see — replaced with `echo`, disabled
# with `if: false`, or simply omitted (typecheck was, and the test did not notice because it only
# looked for `src/e2e/*.ts`). Each fix widened the parser; the parser was the problem.
#
# The per-step commentary that used to live here — why each check exists and what it caught — is in
# the head of each `src/e2e/*.ts` file, where it stays next to the code it explains.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Everything a contributor runs before pushing: typecheck, unit tests, the public build, the
      # synthetic end-to-end build, and every e2e guard. Defined once, in package.json.
      - name: check
        run: bun run check

      # Published bundles are committed so they can be read on GitHub without a local build. If a
      # compiler or guidance change alters them, the regenerated output has to be committed in the
      # same PR. `check` runs build:public above, so a diff here means exactly that.
      - name: Published skills match their inputs
        run: |
          git diff --exit-code -- skills/ ir/lumen-ds || {
            echo "::error::published output drifted — run 'bun run build:public && bun run example' and commit the result"
            exit 1
          }

      # CI-only, and deliberately so: leak.ts scans tracked files against the *complete* text of the
      # proprietary corpora, which are built locally and never committed. It skips itself when they
      # are absent, so it is silent here and meaningful on a machine that has built them.
      - name: No bulk source text in tracked files
        run: bun run src/e2e/leak.ts
