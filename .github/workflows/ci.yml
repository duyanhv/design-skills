name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build public authored guides
        run: bun run build:public
      - name: Published guides match their inputs
        run: git diff --exit-code -- skills/apple-design skills/material-3
      # An end-to-end build over a synthetic source: no network, no proprietary text, but it
      # exercises normalize → extract → compose → validate → eval exactly as a real source does.
      # This is what catches a pipeline break that unit tests alone would not.
      - name: End-to-end build (synthetic source)
        run: bun run src/e2e/run.ts
      # The example skill is committed so people can read real output without a local build.
      # If a compiler change alters it, the example has to be regenerated in the same PR.
      - name: Committed example matches a fresh build
        run: |
          git diff --exit-code -- ir/lumen-ds skills/lumen-ds || {
            echo "::error::examples drifted — run 'bun run example' and commit the result"
            exit 1
          }
      # Every validate guard must be *seen* to fire. A check that has never failed is a guess: a
      # regex that stopped matching would look exactly like a clean build.
      - name: Validate guards fire on corrupted builds
        run: bun run src/e2e/validate-negative.ts
      # The complement of the targeted checks: does anything the source said fail to reach the
      # shipped skill? Skips sources that are not built, so it is meaningful without a network crawl.
      - name: No unexplained content loss
        run: bun run src/e2e/coverage.ts
      # Sentence-level, verbatim. `coverage` compares vocabulary per line and is satisfied when the
      # words appear anywhere on the page, so it could not see a paragraph that a stale render had
      # dropped or that the extractor had attached to the wrong item. Same skip-if-not-built rule.
      - name: Source sentences survive into the shipped references
        run: bun run src/e2e/fidelity.ts
      # The same argument as the validate probes, applied to trace: a check that has never been seen
      # to fail is a guess. Skips itself when the proprietary sources are not built locally.
      - name: Trace checks fire on reintroduced defects
        run: bun run src/e2e/trace-negative.ts
      - name: Manifests parse against the source schema
        run: bun run src/e2e/manifests.ts
      # The README is how people arrive. Its relative links are checked by nothing else, and three
      # ways a link passes locally while 404ing on GitHub: a missing path, a path git does not track
      # (including the local-only apple-hig/wcag22 output), and a renamed heading behind an anchor.
      - name: Documentation links resolve to published paths
        run: bun run src/e2e/docs.ts
      - name: Documentation link guards fire on reintroduced defects
        run: bun run src/e2e/docs-negative.ts
      # The authored guides promise they carry no specifications. A copied number is wrong the next
      # time the source revises it, is usually platform-specific, and is not ours to redistribute.
      # A pattern scan over prose: it catches the accidental literal, not every possible one.
      - name: No known specification patterns in authored guidance prose
        run: bun run src/e2e/specs.ts
      # Pins what that scan catches *and* what it knowingly misses, so the documented caveat cannot
      # quietly become false in either direction.
      - name: Specification scan catches and misses exactly what is documented
        run: bun run src/e2e/specs-negative.ts
      # `links` itself needs the network, so CI runs its guards against a local stub instead. This
      # is the check that would have caught a 200-with-{} being counted as a verified page.
      - name: Link-verifier guards fire on reintroduced defects
        run: bun run src/e2e/links-negative.ts
      # The worked example's published numbers are prose, and prose drifts. Three audits found
      # figures that disagreed with the artifacts they summarised; these invariants are the fix.
      - name: The worked example's claims match its artifacts
        run: bun run src/e2e/example.ts
      # Ignore rules answer "is this path excluded?", not "did the text get in another way?".
      # Skips itself when the proprietary sources are not built, so it is silent here.
      - name: No bulk source text in tracked files
        run: bun run src/e2e/leak.ts
